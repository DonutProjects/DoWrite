name: Make binaries

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            zig_target: x86_64-linux-musl
          - name: aarch64
            zig_target: aarch64-linux-musl
          - name: riscv64
            zig_target: riscv64-linux-musl
          - name: x86
            zig_target: x86-linux-musl
          - name: armv7
            zig_target: arm-linux-musleabihf
          - name: riscv32
            zig_target: riscv32-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Build binary
        run: |
          make \
            CC="zig cc -target ${{ matrix.zig_target }}" \
            CFLAGS="-O3 -Wall -Wextra -Wpedantic" \
            LDFLAGS="-static -s" \
            TARGET="dowrite-${{ matrix.name }}"

      - name: Inspect binary
        run: |
          mkdir -p dist
          mv "dowrite-${{ matrix.name }}" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dowrite-${{ matrix.name }}
          path: dist/dowrite-${{ matrix.name }}
          if-no-files-found: error
