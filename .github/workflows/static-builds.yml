name: Make binaries

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-glibc
            zig_target: x86_64-linux-gnu
          - name: x86_64-musl
            zig_target: x86_64-linux-musl
          - name: aarch64-glibc
            zig_target: aarch64-linux-gnu
          - name: aarch64-musl
            zig_target: aarch64-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build binary
        run: |
          make clean
          make \
            CC="zig cc -target ${{ matrix.zig_target }}" \
            CFLAGS="-O3 -Wall -Wextra -Wpedantic" \
            LDFLAGS="-static -s" \
            TARGET="dowrite-${{ matrix.name }}"

      - name: Inspect binary
        run: |
          file "dowrite-${{ matrix.name }}"
          mkdir -p dist
          mv "dowrite-${{ matrix.name }}" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dowrite-${{ matrix.name }}
          path: dist/dowrite-${{ matrix.name }}
          if-no-files-found: error
